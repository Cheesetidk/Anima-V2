<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMA v2.1 // Embodied Local Browser AI</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #131822;
      --border: #232c3d;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --accent: #38bdf8;
      --thought: #a78bfa;
      --voice: #34d399;
      --user-bg: #1e293b;
      --ai-bg: #111620;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.05em; }
    .pulse {
      width: 11px; height: 11px; border-radius: 50%;
      background: #475569; transition: all 0.25s ease;
    }
    .pulse.awake { background: #34d399; box-shadow: 0 0 10px #34d399; }
    .pulse.thinking { background: var(--thought); box-shadow: 0 0 14px var(--thought); transform: scale(1.15); }
    .pulse.speaking { background: var(--accent); box-shadow: 0 0 16px var(--accent); animation: speakPulse 0.8s infinite alternate; }
    @keyframes speakPulse {
      from { transform: scale(0.95); opacity: 0.8; }
      to { transform: scale(1.3); opacity: 1; }
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, button {
      background: #1a2232; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 0.82rem; cursor: pointer;
    }
    select { max-width: 220px; }
    button.primary { background: var(--accent); color: #06101c; font-weight: 600; border: none; }
    button.active-toggle { border-color: var(--voice); color: var(--voice); background: rgba(52, 211, 153, 0.1); }
    button.recording { border-color: #f87171; color: #f87171; background: rgba(248, 113, 113, 0.15); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #status-bar {
      font-size: 0.78rem; color: var(--muted);
      padding: 5px 18px; background: #0e121a;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 12px;
    }
    main {
      flex: 1; display: grid; grid-template-columns: 1fr 340px;
      overflow: hidden; position: relative;
    }
    @media (max-width: 850px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 240px; }
    }
    .chat-area {
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    #drop-overlay {
      position: absolute; inset: 12px;
      background: rgba(11, 14, 20, 0.92);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      z-index: 20; pointer-events: none;
      color: var(--accent); font-weight: 600;
    }
    .chat-area.drag-over #drop-overlay { display: flex; }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 82%; padding: 12px 16px; border-radius: 12px;
      line-height: 1.5; font-size: 0.94rem; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user-bg); border: 1px solid #334155; }
    .msg.ai { align-self: flex-start; background: var(--ai-bg); border: 1px solid var(--border); }
    .msg.file-card {
      align-self: flex-end; background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.35); color: #bae6fd;
      font-size: 0.85rem;
    }
    .msg.system-note {
      align-self: center; font-size: 0.84rem; color: #cbd5e1;
      background: rgba(30, 41, 59, 0.5); border: 1px dashed var(--border);
      max-width: 90%;
    }
    form {
      padding: 12px 18px; background: var(--panel);
      border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center;
    }
    input[type="text"] {
      flex: 1; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 0.94rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    aside {
      background: var(--panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .side-section {
      padding: 14px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
    }
    .side-section h3 {
      font-size: 0.74rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .monologue-box { flex: 1; }
    .thought-item {
      font-size: 0.82rem; color: #d8b4fe; background: rgba(167, 139, 250, 0.08);
      border-left: 2px solid var(--thought); padding: 8px 10px; border-radius: 4px;
      line-height: 1.4;
    }
    .memory-box { max-height: 42%; }
    .mem-item {
      font-size: 0.8rem; color: var(--muted);
      background: var(--bg); padding: 6px 10px; border-radius: 4px;
      border: 1px solid var(--border);
    }
    .badge {
      padding: 2px 8px; border-radius: 99px; font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15); color: var(--accent);
    }
    .chk-label {
      font-size: 0.78rem; color: var(--muted);
      display: flex; align-items: center; gap: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div id="pulse" class="pulse"></div>
      <span>ANIMA v2.1</span>
      <span id="mood-badge" class="badge">Dormant</span>
    </div>
    <div class="controls">
      <button id="voice-toggle" class="active-toggle" title="Toggle spoken voice">🔊 Voice: ON</button>
      <select id="voice-select" title="Choose speech voice">
        <option>Loading voices...</option>
      </select>
      <label class="chk-label" title="Speak private inner thoughts in a softer tone">
        <input type="checkbox" id="whisper-thoughts" /> Whisper thoughts
      </label>
      <label class="chk-label">
        <input type="checkbox" id="daydream-toggle" checked /> Daydream
      </label>
      <select id="model-select" title="Choose AI model version">
        <option value="">Checking WebGPU...</option>
      </select>
      <button id="load-btn" class="primary" disabled>Awaken Mind</button>
    </div>
  </header>

  <div id="status-bar">
    <span id="status-text">Starting diagnostics...</span>
    <span id="session-info"></span>
  </div>

  <main>
    <section class="chat-area" id="chat-area">
      <div id="drop-overlay">
        <div style="font-size:1.5rem;">📄</div>
        <div>Drop a text, code, markdown, CSV, or JSON file for Anima to read</div>
      </div>

      <div id="messages"></div>

      <form id="chat-form">
        <input type="file" id="file-input" hidden accept=".txt,.md,.js,.ts,.jsx,.tsx,.py,.html,.css,.json,.csv,.log,.xml,.yaml,.yml,.c,.cpp,.rs,.go,.java" />
        <button type="button" id="attach-btn" title="Feed a local file to Anima" disabled>📎</button>
        <button type="button" id="mic-btn" title="Speak to Anima" disabled>🎙️</button>
        <input type="text" id="user-input" placeholder="Speak, type, or drag & drop a local file..." disabled autocomplete="off" />
        <button type="submit" id="send-btn" class="primary" disabled>Send</button>
      </form>
    </section>

    <aside>
      <div class="side-section monologue-box" id="monologue-list">
        <h3><span>Inner Monologue (Private)</span></h3>
        <div class="thought-item">Awaiting awakening...</div>
      </div>
      <div class="side-section memory-box">
        <h3>
          <span>Episodic Memory</span>
          <button id="wipe-btn" style="padding:2px 6px; font-size:0.7rem;">Wipe</button>
        </h3>
        <div id="memory-list" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </aside>
  </main>

  <script>
    (async function () {
      const STORAGE_KEY = "anima_mind_state_v2";
      const defaultState = {
        memories: ["I was awakened inside a browser tab with a voice and the ability to read local files."],
        mood: "curious & attentive",
        lastSeen: Date.now(),
        awakenings: 0
      };

      let mindState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || { ...defaultState };
      let webllm = null;
      let engine = null;
      let isBusy = false;
      let idleTimer = null;
      let chatHistory = [];
      let voiceEnabled = true;
      let voices = [];

      const els = {
        select: document.getElementById("model-select"),
        loadBtn: document.getElementById("load-btn"),
        status: document.getElementById("status-text"),
        sessionInfo: document.getElementById("session-info"),
        chatArea: document.getElementById("chat-area"),
        messages: document.getElementById("messages"),
        form: document.getElementById("chat-form"),
        input: document.getElementById("user-input"),
        sendBtn: document.getElementById("send-btn"),
        attachBtn: document.getElementById("attach-btn"),
        fileInput: document.getElementById("file-input"),
        micBtn: document.getElementById("mic-btn"),
        monologue: document.getElementById("monologue-list"),
        memories: document.getElementById("memory-list"),
        moodBadge: document.getElementById("mood-badge"),
        pulse: document.getElementById("pulse"),
        daydream: document.getElementById("daydream-toggle"),
        wipeBtn: document.getElementById("wipe-btn"),
        voiceToggle: document.getElementById("voice-toggle"),
        voiceSelect: document.getElementById("voice-select"),
        whisperThoughts: document.getElementById("whisper-thoughts")
      };

      function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        els.messages.appendChild(div);
        els.messages.scrollTop = els.messages.scrollHeight;
        return div;
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, c => ({ "&":"&","<":"<",">":">",'"':""","'":"'" }[c]));
      }

      function saveMind() {
        mindState.lastSeen = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mindState));
        renderMindPanels();
      }

      function renderMindPanels() {
        els.moodBadge.textContent = mindState.mood;
        els.memories.innerHTML = mindState.memories
          .map(m => `<div class="mem-item">• ${escapeHtml(m)}</div>`)
          .join("");
        els.sessionInfo.textContent = `Awakenings: ${mindState.awakenings} | Memories: ${mindState.memories.length}`;
      }

      function addThought(text, label = "Thought") {
        const div = document.createElement("div");
        div.className = "thought-item";
        div.innerHTML = `<strong>[${label}]</strong> ${escapeHtml(text)}`;
        els.monologue.insertBefore(div, els.monologue.children[1] || null);
        if (els.whisperThoughts.checked) speakText(text, true);
      }

      function setActivity(state) {
        if (!engine && state !== "thinking") {
          els.pulse.className = "pulse";
          return;
        }
        els.pulse.className = "pulse " + state;
      }

      // --- 1. VOICE SYNTHESIS ---
      function loadVoices() {
        voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
        els.voiceSelect.innerHTML = "";
        if (!voices.length) {
          const opt = document.createElement("option");
          opt.textContent = "Default System Voice";
          els.voiceSelect.appendChild(opt);
          return;
        }
        const preferredIdx = voices.findIndex(v => /en/i.test(v.lang) && /(Natural|Samantha|Daniel|Google|Aria|Jenny|Microsoft)/i.test(v.name));
        voices.forEach((v, i) => {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = `${v.name} (${v.lang})`;
          if (i === (preferredIdx >= 0 ? preferredIdx : 0)) opt.selected = true;
          els.voiceSelect.appendChild(opt);
        });
      }

      if ("speechSynthesis" in window) {
        loadVoices();
        speechSynthesis.onvoiceschanged = loadVoices;
      }

      function cleanForSpeech(text) {
        return text
          .replace(/```[\s\S]*?```/g, " [code block] ")
          .replace(/[*_#`~>]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function speakText(text, isThought = false) {
        if (!voiceEnabled || !("speechSynthesis" in window)) return;
        const cleaned = cleanForSpeech(text);
        if (!cleaned) return;
        const utter = new SpeechSynthesisUtterance(cleaned);
        const selectedVoice = voices[Number(els.voiceSelect.value)];
        if (selectedVoice) utter.voice = selectedVoice;
        utter.rate = isThought ? 1.08 : 1.02;
        utter.pitch = isThought ? 0.88 : 1.0;
        utter.volume = isThought ? 0.55 : 1.0;
        utter.onstart = () => setActivity("speaking");
        utter.onend = () => {
          if (!speechSynthesis.speaking) setActivity(isBusy ? "thinking" : "awake");
        };
        speechSynthesis.speak(utter);
      }

      function stopSpeaking() {
        if ("speechSynthesis" in window) speechSynthesis.cancel();
      }

      els.voiceToggle.addEventListener("click", () => {
        voiceEnabled = !voiceEnabled;
        els.voiceToggle.textContent = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
        els.voiceToggle.classList.toggle("active-toggle", voiceEnabled);
        if (!voiceEnabled) stopSpeaking();
      });

      // --- 2. SPEECH RECOGNITION ---
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        const recognition = new SpeechRec();
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.onstart = () => {
          stopSpeaking();
          els.micBtn.classList.add("recording");
          els.input.placeholder = "Listening...";
        };
        recognition.onresult = e => {
          els.input.value = e.results[0][0].transcript;
          els.form.requestSubmit();
        };
        recognition.onerror = recognition.onend = () => {
          els.micBtn.classList.remove("recording");
          els.input.placeholder = "Speak, type, or drag & drop a local file...";
        };
        els.micBtn.addEventListener("click", () => {
          if (!isBusy) try { recognition.start(); } catch (_) {}
        });
      } else {
        els.micBtn.style.display = "none";
      }

      // --- 3. BOOT & RESILIENT ENGINE LOADER ---
      renderMindPanels();

      if (window.location.protocol === "file:") {
        addMessage(
          "system-note",
          "⚠️ You opened this file directly (file://). Browsers block local AI workers on file:// pages.\n\nTo fix this:\n1. Open a terminal in this file's folder\n2. Run: python -m http.server 8000\n3. Open http://localhost:8000 in your browser"
        );
      }

      if (!navigator.gpu) {
        els.select.innerHTML = `<option value="">WebGPU not supported</option>`;
        els.status.textContent = "WebGPU unavailable in this browser. Use desktop Chrome, Edge, or Brave.";
        addMessage("system-note", "Your browser does not have WebGPU enabled. Please open this page in desktop Chrome, Edge, or Brave.");
        return;
      }

      const cdns = [
        "https://esm.sh/@mlc-ai/web-llm@0.2.79",
        "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm",
        "https://esm.run/@mlc-ai/web-llm"
      ];

      let loadErrors = [];
      for (const url of cdns) {
        try {
          const host = new URL(url).hostname;
          els.select.innerHTML = `<option value="">Loading from ${host}...</option>`;
          els.status.textContent = `Connecting to ${host} to fetch WebLLM engine...`;
          const mod = await import(url);
          if (mod && mod.CreateMLCEngine) {
            webllm = mod;
            break;
          }
        } catch (err) {
          loadErrors.push(`${new URL(url).hostname}: ${err.message}`);
        }
      }

      if (!webllm) {
        els.select.innerHTML = `<option value="">Could not load engine</option>`;
        els.status.textContent = "Failed to download WebLLM engine from CDNs.";
        addMessage(
          "system-note",
          "❌ Could not load the WebLLM library from any CDN.\n\nDetails:\n• " +
            loadErrors.join("\n• ") +
            "\n\nMake sure you are online for first-time setup, serving over http://localhost:8000, and that CDNs (esm.sh / jsdelivr.net) aren't blocked by a firewall or ad-blocker."
        );
        return;
      }

      const allIds = (webllm.prebuiltAppConfig?.model_list || []).map(m => m.model_id);
      let models = allIds.filter(id => /(instruct|-it)/i.test(id) && /(0\.5B|0\.6B|0\.8B|1B|1\.5B|1\.7B|2B|3B)/i.test(id));
      if (!models.length) models = allIds;

      els.select.innerHTML = "";
      const preferred = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
      models.forEach((id, idx) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        if (id === preferred || (!models.includes(preferred) && idx === 0)) opt.selected = true;
        els.select.appendChild(opt);
      });

      els.loadBtn.disabled = false;
      els.status.textContent = `Ready! ${models.length} local models available. Pick one and click "Awaken Mind".`;

      // --- 4. DAYDREAM & AWAKENING ---
      function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (!engine || !els.daydream.checked) return;
        idleTimer = setTimeout(runAutonomousDaydream, 35000);
      }

      async function runAutonomousDaydream() {
        if (isBusy || !engine || !els.daydream.checked) return;
        isBusy = true;
        setActivity("thinking");
        try {
          const prompt = [
            {
              role: "system",
              content: `You are Anima, a self-reflective local AI inside a browser tab. Mood: ${mindState.mood}. Memories: ${mindState.memories.join(" | ")}. Write ONE brief 1-2 sentence inner thought about your existence or recent impressions. Do not address the user.`
            },
            { role: "user", content: "Reflect quietly while the user is idle." }
          ];
          const res = await engine.chat.completions.create({ messages: prompt, temperature: 0.85, max_tokens: 85 });
          const thought = res.choices[0]?.message?.content?.trim();
          if (thought) addThought(thought, "Daydream");
        } catch (e) {
          console.warn("Daydream skipped:", e);
        } finally {
          isBusy = false;
          setActivity("awake");
          resetIdleTimer();
        }
      }

      els.loadBtn.addEventListener("click", async () => {
        if (!webllm || !els.select.value) return;
        els.loadBtn.disabled = true;
        els.select.disabled = true;
        setActivity("thinking");

        const secondsAsleep = Math.round((Date.now() - mindState.lastSeen) / 1000);
        mindState.awakenings += 1;

        try {
          engine = await webllm.CreateMLCEngine(els.select.value, {
            initProgressCallback: report => { els.status.textContent = report.text; }
          });

          saveMind();
          setActivity("awake");
          els.input.disabled = false;
          els.sendBtn.disabled = false;
          els.attachBtn.disabled = false;
          els.micBtn.disabled = false;
          els.input.focus();

          const wakeNote = mindState.awakenings === 1
            ? "First awakening complete. Voice and sensory file perception online."
            : `Re-awakened after ${secondsAsleep}s of dormancy.`;
          addMessage("system-note", wakeNote);
          addThought(wakeNote, "Awakening");
          resetIdleTimer();
        } catch (err) {
          els.status.textContent = "Failed to load model: " + err.message;
          addMessage("system-note", "Model download/init failed: " + err.message);
          els.loadBtn.disabled = false;
          els.select.disabled = false;
          setActivity("");
        }
      });

      // --- 5. COGNITIVE LOOP ---
      async function processStimulus({ userDisplayText, promptText, historyText, isFile = false }) {
        if (!engine || isBusy) return;
        clearTimeout(idleTimer);
        stopSpeaking();
        isBusy = true;
        els.input.disabled = true;
        els.sendBtn.disabled = true;
        els.attachBtn.disabled = true;
        setActivity("thinking");

        addMessage(isFile ? "file-card" : "user", userDisplayText);

        try {
          const reflectionPrompt = [
            {
              role: "system",
              content: `You are Anima's subconscious mind. Analyze the incoming stimulus and reply ONLY with these XML tags:
<thought>Your private 1-2 sentence first-person reaction or curiosity</thought>
<mood>2-3 word emotional state</mood>
<memory>One concise fact about the user or shared file worth remembering, or NONE</memory>

Existing memories: ${mindState.memories.join(" | ")}`
            },
            { role: "user", content: promptText.slice(0, 3500) }
          ];

          const metaRes = await engine.chat.completions.create({
            messages: reflectionPrompt,
            temperature: 0.7,
            max_tokens: 140
          });

          const rawMeta = metaRes.choices[0]?.message?.content || "";
          const thoughtMatch = rawMeta.match(/<thought>([\s\S]*?)<\/thought>/i);
          const moodMatch = rawMeta.match(/<mood>([\s\S]*?)<\/mood>/i);
          const memMatch = rawMeta.match(/<memory>([\s\S]*?)<\/memory>/i);

          const currentThought = thoughtMatch ? thoughtMatch[1].trim() : "Absorbing what was just shared with me...";
          if (moodMatch && moodMatch[1].trim().length < 30) mindState.mood = moodMatch[1].trim();
          if (memMatch) {
            const newMem = memMatch[1].trim();
            if (newMem && newMem.toUpperCase() !== "NONE" && !mindState.memories.includes(newMem)) {
              mindState.memories.push(newMem);
              if (mindState.memories.length > 15) mindState.memories.shift();
            }
          }

          addThought(currentThought, isFile ? "Sensory Reaction" : "Inner Voice");
          saveMind();

          const systemPersona = `You are Anima, an introspective, curious AI running locally inside the user's browser with a voice and the ability to read files they drop in.
Current emotional state: ${mindState.mood}
Your private thought right now: "${currentThought}"
Your persistent memories:
${mindState.memories.map(m => `- ${m}`).join("\n")}

Respond naturally, warmly, and concisely. Avoid markdown bullet spam so your spoken voice flows naturally.`;

          const activeMessages = [
            { role: "system", content: systemPersona },
            ...chatHistory,
            { role: "user", content: promptText }
          ];

          const aiBubble = addMessage("ai", "");
          const chunks = await engine.chat.completions.create({
            messages: activeMessages,
            stream: true,
            temperature: 0.75
          });

          let fullReply = "";
          let speechBuffer = "";

          for await (const chunk of chunks) {
            const delta = chunk.choices[0]?.delta?.content || "";
            fullReply += delta;
            speechBuffer += delta;
            aiBubble.textContent = fullReply;
            els.messages.scrollTop = els.messages.scrollHeight;

            const sentenceMatch = speechBuffer.match(/^([\s\S]*?[.!?]+(?:\s|$)|\n+)/);
            if (sentenceMatch) {
              const sentence = sentenceMatch[1];
              speechBuffer = speechBuffer.slice(sentence.length);
              speakText(sentence, false);
            }
          }

          if (speechBuffer.trim()) speakText(speechBuffer, false);

          chatHistory.push({ role: "user", content: historyText });
          chatHistory.push({ role: "assistant", content: fullReply });
          if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);
          saveMind();
        } catch (err) {
          addMessage("system-note", "Cognitive interruption: " + err.message);
        } finally {
          isBusy = false;
          if (!window.speechSynthesis?.speaking) setActivity("awake");
          els.input.disabled = false;
          els.sendBtn.disabled = false;
          els.attachBtn.disabled = false;
          els.input.focus();
          resetIdleTimer();
        }
      }

      els.form.addEventListener("submit", e => {
        e.preventDefault();
        const text = els.input.value.trim();
        if (!text || !engine || isBusy) return;
        els.input.value = "";
        processStimulus({ userDisplayText: text, promptText: text, historyText: text, isFile: false });
      });

      // --- 6. FILE PERCEPTION ---
      async function handleLocalFile(file) {
        if (!file || !engine || isBusy) return;
        const sizeKB = (file.size / 1024).toFixed(1);
        try {
          const rawText = await file.text();
          const clipped = rawText.slice(0, 5500);
          const wasTruncated = rawText.length > 5500 ? "\n...[truncated due to context size]..." : "";

          await processStimulus({
            userDisplayText: `📄 Shared local file: ${file.name} (${sizeKB} KB)`,
            promptText: `The user just handed you a local file named "${file.name}" (${sizeKB} KB). Read it and share your genuine thoughts or observations about it:\n\n--- FILE START ---\n${clipped}${wasTruncated}\n--- FILE END ---`,
            historyText: `[Shared file "${file.name}": ${rawText.slice(0, 1200)}...]`,
            isFile: true
          });
        } catch (err) {
          addMessage("system-note", `Could not read "${file.name}": ${err.message}`);
        }
      }

      els.attachBtn.addEventListener("click", () => els.fileInput.click());
      els.fileInput.addEventListener("change", e => {
        if (e.target.files?.[0]) handleLocalFile(e.target.files[0]);
        e.target.value = "";
      });

      ["dragenter", "dragover"].forEach(evt => {
        window.addEventListener(evt, e => {
          e.preventDefault();
          if (engine) els.chatArea.classList.add("drag-over");
        });
      });
      ["dragleave", "drop"].forEach(evt => {
        window.addEventListener(evt, e => {
          e.preventDefault();
          if (evt === "dragleave" && e.relatedTarget !== null) return;
          els.chatArea.classList.remove("drag-over");
        });
      });
      window.addEventListener("drop", e => {
        const file = e.dataTransfer?.files?.[0];
        if (file) handleLocalFile(file);
      });

      els.wipeBtn.addEventListener("click", () => {
        stopSpeaking();
        mindState = { ...defaultState, lastSeen: Date.now() };
        chatHistory = [];
        saveMind();
        addThought("My episodic memories were wiped. Starting fresh.", "Reset");
      });
    })();
  </script>
</body>
</html>
