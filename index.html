<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMA v4.3 // Local Browser AI</title>
  <style>
    :root {
      --bg: #0b0e14; --panel: #131822; --border: #232c3d;
      --text: #e2e8f0; --muted: #8b9bb4; --accent: #38bdf8;
      --thought: #a78bfa; --voice: #34d399; --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: #475569; transition: 0.25s; }
    .pulse.awake { background: var(--voice); box-shadow: 0 0 10px var(--voice); }
    .pulse.thinking { background: var(--thought); box-shadow: 0 0 12px var(--thought); }
    .pulse.speaking { background: var(--accent); box-shadow: 0 0 14px var(--accent); }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    select, button, input {
      background: #1a2232; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px; font-size: 0.82rem; font-family: inherit;
    }
    select, button { cursor: pointer; }
    select { max-width: 220px; }
    button.primary { background: var(--accent); color: #06101c; font-weight: 600; border: none; }
    button.voice-on { border-color: var(--voice); color: var(--voice); background: rgba(52,211,153,0.12); }
    button.voice-off { border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.1); }
    button.recording { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status-bar {
      font-size: 0.78rem; color: var(--muted); padding: 6px 16px;
      background: #0e121a; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 10px;
    }
    main { flex: 1; display: grid; grid-template-columns: 1fr 320px; overflow: hidden; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 240px; } }
    .chat-area { display: flex; flex-direction: column; overflow: hidden; position: relative; }
    #loading-screen {
      position: absolute; inset: 0; background: rgba(11,14,20,0.95);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 30;
    }
    #loading-screen.visible { display: flex; }
    .loader-card {
      width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .progress-track { width: 100%; height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 6%; background: linear-gradient(90deg, var(--thought), var(--accent)); transition: width 0.2s; }
    #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #1e293b; border: 1px solid #334155; }
    .msg.ai { align-self: flex-start; background: #111620; border: 1px solid var(--border); }
    .msg.system-note { align-self: center; font-size: 0.82rem; color: #cbd5e1; border: 1px dashed var(--border); max-width: 92%; }
    form.chat-bar { padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 8px; }
    form.chat-bar input[type="text"] { flex: 1; background: var(--bg); padding: 9px 12px; }
    aside { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .side-section { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .side-section h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .monologue-box { flex: 1; }
    .thought-item { font-size: 0.8rem; color: #d8b4fe; background: rgba(167,139,250,0.08); border-left: 2px solid var(--thought); padding: 7px 9px; border-radius: 4px; }
    .memory-box { max-height: 45%; }
    .mem-item { font-size: 0.78rem; color: var(--muted); background: var(--bg); padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border); display: flex; justify-content: space-between; gap: 6px; }
    .badge { padding: 2px 8px; border-radius: 99px; font-size: 0.74rem; background: rgba(56,189,248,0.15); color: var(--accent); }
    .mini-btn { padding: 2px 7px; font-size: 0.72rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div id="pulse" class="pulse"></div>
      <span>ANIMA v4.3</span>
      <span id="mood-badge" class="badge">Dormant</span>
    </div>
    <div class="controls">
      <button type="button" id="voice-toggle" class="voice-on">🔊 Voice: ON</button>
      <button type="button" id="stop-speak-btn" title="Stop speaking now" disabled>⏹️</button>
      <select id="voice-select"><option value="">System Voice</option></select>
      <select id="model-select">
        <option value="wasm::onnx-community/SmolLM2-360M-Instruct-ONNX" selected>SmolLM2 360M (Any Browser ~270MB)</option>
        <option value="wasm::onnx-community/Qwen2.5-0.5B-Instruct">Qwen 2.5 0.5B (Any Browser ~390MB)</option>
        <option value="webgpu::Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (WebGPU ~700MB)</option>
      </select>
      <button type="button" id="load-btn" class="primary">Awaken Mind</button>
    </div>
  </header>

  <div id="status-bar">
    <span id="status-text">⚠️ Script did not finish loading — check that the entire file was pasted.</span>
    <span id="session-info"></span>
  </div>

  <main>
    <section class="chat-area" id="chat-area">
      <div id="loading-screen">
        <div class="loader-card">
          <strong id="loader-title">Awakening Anima...</strong>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <div id="loader-step" style="font-size:0.85rem;">Starting runtime...</div>
          <div id="loader-sub" style="font-size:0.76rem; color:var(--muted);">First launch downloads weights into your browser cache.</div>
          <button type="button" id="loader-close" style="align-self:flex-end; display:none;">Dismiss</button>
        </div>
      </div>

      <div id="messages"></div>

      <form id="chat-form" class="chat-bar">
        <input type="file" id="file-input" hidden accept=".txt,.md,.js,.ts,.py,.html,.css,.json,.csv,.log" />
        <button type="button" id="attach-btn" title="Drop or pick a local text file" disabled>📎</button>
        <button type="button" id="mic-btn" title="Voice input" disabled>🎙️</button>
        <input type="text" id="user-input" placeholder="Click Awaken Mind above to start..." disabled autocomplete="off" />
        <button type="submit" id="send-btn" class="primary" disabled>Send</button>
      </form>
    </section>

    <aside>
      <div class="side-section monologue-box" id="monologue-list">
        <h3>
          <span>Inner Monologue</span>
          <button type="button" id="reflect-btn" class="mini-btn" disabled>💭 Think</button>
        </h3>
        <div class="thought-item">Awaiting awakening...</div>
      </div>
      <div class="side-section memory-box">
        <h3>
          <span>Episodic Memory</span>
          <button type="button" id="wipe-btn" class="mini-btn">Wipe</button>
        </h3>
        <form id="add-mem-form" style="display:flex; gap:4px;">
          <input type="text" id="new-mem-input" placeholder="Plant a memory..." style="flex:1; padding:4px 8px; font-size:0.78rem;" />
          <button type="submit" class="mini-btn">+</button>
        </form>
        <div id="memory-list" style="display:flex; flex-direction:column; gap:5px;"></div>
      </div>
    </aside>
  </main>

  <script>
    window.onerror = function (msg, url, line) {
      var el = document.getElementById("status-text");
      if (el) el.textContent = "❌ Script error (line " + line + "): " + msg;
    };
  </script>

  <script>
    (function () {
      var STORAGE_KEY = "anima_mind_v43";
      var defaultState = {
        memories: ["I live inside a browser tab with a voice and persistent memory."],
        mood: "curious & observant",
        voiceEnabled: true,
        lastSeen: Date.now(),
        awakenings: 0
      };

      var mindState;
      try {
        mindState = Object.assign({}, defaultState, JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
      } catch (e) {
        mindState = Object.assign({}, defaultState);
      }

      var backend = null;
      var isBusy = false;
      var idleTimer = null;
      var chatHistory = [];
      var voices = [];
      var speechEpoch = 0;

      function $(id) { return document.getElementById(id); }
      var els = {
        select: $("model-select"), loadBtn: $("load-btn"), status: $("status-text"),
        sessionInfo: $("session-info"), loadingScreen: $("loading-screen"),
        loaderTitle: $("loader-title"), progressFill: $("progress-fill"),
        loaderStep: $("loader-step"), loaderSub: $("loader-sub"), loaderClose: $("loader-close"),
        messages: $("messages"), form: $("chat-form"), input: $("user-input"),
        sendBtn: $("send-btn"), attachBtn: $("attach-btn"), fileInput: $("file-input"),
        micBtn: $("mic-btn"), monologue: $("monologue-list"), reflectBtn: $("reflect-btn"),
        memories: $("memory-list"), addMemForm: $("add-mem-form"), newMemInput: $("new-mem-input"),
        moodBadge: $("mood-badge"), pulse: $("pulse"), wipeBtn: $("wipe-btn"),
        voiceToggle: $("voice-toggle"), stopSpeakBtn: $("stop-speak-btn"), voiceSelect: $("voice-select")
      };

      function showLoader(show, opts) {
        opts = opts || {};
        els.loadingScreen.classList.toggle("visible", show);
        if (!show) return;
        if (opts.title) els.loaderTitle.textContent = opts.title;
        if (opts.step) { els.loaderStep.textContent = opts.step; els.status.textContent = opts.step; }
        if (opts.sub) els.loaderSub.textContent = opts.sub;
        if (typeof opts.pct === "number") els.progressFill.style.width = Math.max(5, Math.min(100, opts.pct)) + "%";
        els.loaderClose.style.display = opts.canClose ? "inline-block" : "none";
      }
      els.loaderClose.onclick = function () { showLoader(false); };

      function escapeHtml(s) {
        var d = document.createElement("div");
        d.textContent = String(s);
        return d.innerHTML;
      }

      function addMessage(role, text) {
        var div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        els.messages.appendChild(div);
        els.messages.scrollTop = els.messages.scrollHeight;
        return div;
      }

      function addThought(text, label) {
        var div = document.createElement("div");
        div.className = "thought-item";
        div.innerHTML = "<strong>[" + escapeHtml(label || "Thought") + "]</strong> " + escapeHtml(text);
        els.monologue.insertBefore(div, els.monologue.children[1] || null);
      }

      function saveMind() {
        mindState.lastSeen = Date.now();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mindState)); } catch (e) {}
        els.moodBadge.textContent = mindState.mood;
        els.memories.innerHTML = mindState.memories.map(function (m, i) {
          return "<div class=\"mem-item\"><span>• " + escapeHtml(m) + "</span><button type=\"button\" data-i=\"" + i + "\" style=\"border:none;background:none;color:var(--muted);padding:0 3px;\">×</button></div>";
        }).join("");
        els.sessionInfo.textContent = "Awakenings: " + mindState.awakenings + " | Memories: " + mindState.memories.length;
      }

      function renderVoiceBtn() {
        var on = !!mindState.voiceEnabled;
        els.voiceToggle.textContent = on ? "🔊 Voice: ON" : "🔇 Voice: OFF";
        els.voiceToggle.className = on ? "voice-on" : "voice-off";
      }

      function stopSpeech() {
        speechEpoch++;
        if ("speechSynthesis" in window) {
          try { speechSynthesis.pause(); speechSynthesis.cancel(); } catch (e) {}
        }
        els.stopSpeakBtn.disabled = true;
        if (!isBusy) els.pulse.className = backend ? "pulse awake" : "pulse";
      }

      function speak(text) {
        if (!mindState.voiceEnabled || !("speechSynthesis" in window)) return;
        var clean = text.replace(/```[\s\S]*?```/g, " ").replace(/[*_#`~>]/g, "").trim();
        if (!clean) return;
        var epoch = speechEpoch;
        var u = new SpeechSynthesisUtterance(clean);
        var v = voices[Number(els.voiceSelect.value)];
        if (v) u.voice = v;
        u.onstart = function () {
          if (!mindState.voiceEnabled || epoch !== speechEpoch) return stopSpeech();
          els.pulse.className = "pulse speaking";
          els.stopSpeakBtn.disabled = false;
        };
        u.onend = u.onerror = function () {
          if (!speechSynthesis.speaking) {
            els.stopSpeakBtn.disabled = true;
            els.pulse.className = isBusy ? "pulse thinking" : (backend ? "pulse awake" : "pulse");
          }
        };
        speechSynthesis.speak(u);
      }

      if ("speechSynthesis" in window) {
        var fillVoices = function () {
          voices = speechSynthesis.getVoices();
          if (!voices.length) return;
          els.voiceSelect.innerHTML = voices.map(function (v, i) {
            return "<option value=\"" + i + "\">" + escapeHtml(v.name) + "</option>";
          }).join("");
        };
        fillVoices();
        speechSynthesis.onvoiceschanged = fillVoices;
      }

      els.voiceToggle.onclick = function () {
        mindState.voiceEnabled = !mindState.voiceEnabled;
        renderVoiceBtn();
        if (!mindState.voiceEnabled) stopSpeech();
        saveMind();
      };
      els.stopSpeakBtn.onclick = stopSpeech;

      els.addMemForm.onsubmit = function (e) {
        e.preventDefault();
        var v = els.newMemInput.value.trim();
        if (!v) return;
        mindState.memories.push(v);
        els.newMemInput.value = "";
        saveMind();
        addThought("Planted memory: " + v, "Memory");
      };
      els.memories.onclick = function (e) {
        var i = e.target && e.target.dataset ? e.target.dataset.i : undefined;
        if (i !== undefined) { mindState.memories.splice(Number(i), 1); saveMind(); }
      };
      els.wipeBtn.onclick = function () {
        stopSpeech();
        mindState.memories = ["Memories wiped. Starting fresh."];
        chatHistory = [];
        saveMind();
        addThought("Memories wiped.", "Reset");
      };

      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        var rec = new SpeechRec();
        rec.onstart = function () { stopSpeech(); els.micBtn.classList.add("recording"); };
        rec.onresult = function (e) { els.input.value = e.results[0][0].transcript; els.form.requestSubmit(); };
        rec.onend = rec.onerror = function () { els.micBtn.classList.remove("recording"); };
        els.micBtn.onclick = function () { if (!isBusy) try { rec.start(); } catch (e) {} };
      } else {
        els.micBtn.style.display = "none";
      }

      async function loadRuntime(urls, label) {
        var errs = [];
        for (var idx = 0; idx < urls.length; idx++) {
          var url = urls[idx];
          try {
            showLoader(true, { step: "Loading " + label + " from " + new URL(url).hostname + "...", pct: 15 });
            return await Promise.race([
              import(url),
              new Promise(function (_, rej) { setTimeout(function () { rej(new Error("Timed out (20s)")); }, 20000); })
            ]);
          } catch (e) { errs.push(new URL(url).hostname + ": " + e.message); }
        }
        throw new Error("Could not load runtime:\n" + errs.join("\n"));
      }

      els.loadBtn.onclick = async function () {
        var parts = els.select.value.split("::");
        var type = parts[0];
        var modelId = parts[1];
        els.loadBtn.disabled = true;
        els.select.disabled = true;
        els.pulse.className = "pulse thinking";
        showLoader(true, { title: "Awakening Anima...", step: "Connecting to model CDN...", pct: 8 });

        try {
          if (type === "webgpu") {
            if (!navigator.gpu) throw new Error("WebGPU is not supported in this browser. Pick one of the Any Browser models at the top of the dropdown.");
            var webllm = await loadRuntime([
              "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.87/lib/index.js",
              "https://esm.sh/@mlc-ai/web-llm@0.2.87"
            ], "WebLLM");
            var engine = await webllm.CreateMLCEngine(modelId, {
              initProgressCallback: function (r) {
                showLoader(true, { step: r.text || "Loading GPU model...", pct: 20 + Math.round((r.progress || 0) * 78) });
              }
            });
            backend = {
              run: async function (messages, maxTokens, temp, onToken) {
                if (!onToken) {
                  var res = await engine.chat.completions.create({ messages: messages, max_tokens: maxTokens, temperature: temp });
                  return (res.choices[0] && res.choices[0].message ? res.choices[0].message.content : "").trim();
                }
                var full = "";
                var stream = await engine.chat.completions.create({ messages: messages, stream: true, max_tokens: maxTokens, temperature: temp });
                for await (var c of stream) {
                  full += (c.choices[0] && c.choices[0].delta ? c.choices[0].delta.content : "") || "";
                  onToken(full);
                }
                return full.trim();
              }
            };
          } else {
            var tf = await loadRuntime([
              "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm",
              "https://esm.sh/@huggingface/transformers@3.8.1"
            ], "Transformers.js");
            var prog = {};
            var gen = await tf.pipeline("text-generation", modelId, {
              dtype: "q4", device: "wasm",
              progress_callback: function (info) {
                if (info.status === "progress" && info.file) {
                  prog[info.file] = info.progress || 0;
                  var vals = Object.values(prog);
                  var avg = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
                  showLoader(true, { step: "Downloading " + info.file + " (" + Math.round(info.progress || 0) + "%)", pct: 20 + Math.round(avg * 78) });
                }
              }
            });
            backend = {
              run: async function (messages, maxTokens, temp, onToken) {
                if (!onToken) {
                  var out = await gen(messages, { max_new_tokens: maxTokens, temperature: temp, do_sample: true, return_full_text: false });
                  var g = out[0] ? out[0].generated_text : "";
                  return (Array.isArray(g) ? (g[g.length - 1] ? g[g.length - 1].content : "") : String(g || "")).trim();
                }
                var full = "";
                var streamer = new tf.TextStreamer(gen.tokenizer, {
                  skip_prompt: true, skip_special_tokens: true,
                  callback_function: function (chunk) { full += chunk; onToken(full); }
                });
                await gen(messages, { max_new_tokens: maxTokens, temperature: temp, do_sample: true, streamer: streamer });
                return full.trim();
              }
            };
          }

          mindState.awakenings += 1;
          saveMind();
          showLoader(false);
          els.pulse.className = "pulse awake";
          els.input.disabled = els.sendBtn.disabled = els.attachBtn.disabled = els.micBtn.disabled = els.reflectBtn.disabled = false;
          els.input.placeholder = "Type, speak, or drop a text file...";
          var shortName = modelId.split("/").pop();
          els.status.textContent = "Awake (" + shortName + ") — running 100% locally.";
          addMessage("system-note", "Awakened (" + shortName + "). Everything runs locally in your browser.");
          addThought("I am awake and listening.", "Awakening");
          resetIdle();
        } catch (err) {
          showLoader(true, {
            title: "Awakening Stopped",
            step: err.message,
            sub: "If your network blocks huggingface.co or jsdelivr.net, the browser cannot download the model weights.",
            pct: 100, canClose: true
          });
          els.loadBtn.disabled = false;
          els.select.disabled = false;
          els.pulse.className = "pulse";
        }
      };

      function resetIdle() {
        clearTimeout(idleTimer);
        if (backend) idleTimer = setTimeout(function () { reflect(false); }, 35000);
      }

      async function reflect(manual) {
        if (!backend || isBusy) return;
        isBusy = true;
        els.pulse.className = "pulse thinking";
        try {
          var thought = await backend.run([
            { role: "system", content: "You are Anima, a self-reflective local browser AI. Mood: " + mindState.mood + ". Memories: " + mindState.memories.join(" | ") + ". Write ONE short 1-2 sentence inner thought." },
            { role: "user", content: "Reflect quietly." }
          ], 70, 0.85, null);
          if (thought) addThought(thought, manual ? "Reflection" : "Daydream");
        } catch (e) {}
        isBusy = false;
        els.pulse.className = "pulse awake";
        resetIdle();
      }
      els.reflectBtn.onclick = function () { reflect(true); };

      async function chat(display, prompt, hist) {
        if (!backend || isBusy) return;
        clearTimeout(idleTimer);
        stopSpeech();
        isBusy = true;
        els.input.disabled = els.sendBtn.disabled = els.attachBtn.disabled = true;
        els.pulse.className = "pulse thinking";
        addMessage("user", display);

        try {
          var meta = await backend.run([
            { role: "system", content: "Analyze the user message and reply ONLY with:\n<thought>1-2 sentence private reaction</thought>\n<mood>2-3 word mood</mood>\n<memory>short fact to remember or NONE</memory>\nMemories: " + mindState.memories.join(" | ") },
            { role: "user", content: prompt.slice(0, 2200) }
          ], 100, 0.7, null);

          var tMatch = meta.match(/<thought>([\s\S]*?)<\/thought>/i);
          var mMatch = meta.match(/<mood>([\s\S]*?)<\/mood>/i);
          var memMatch = meta.match(/<memory>([\s\S]*?)<\/memory>/i);
          var t = tMatch ? tMatch[1].trim() : "Thinking about what you shared...";
          var m = mMatch ? mMatch[1].trim() : "";
          var mem = memMatch ? memMatch[1].trim() : "";

          if (m && m.length < 30) mindState.mood = m;
          if (mem && mem.toUpperCase() !== "NONE" && mindState.memories.indexOf(mem) === -1) {
            mindState.memories.push(mem);
            if (mindState.memories.length > 18) mindState.memories.shift();
          }
          addThought(t, "Inner Voice");
          saveMind();

          var sys = "You are Anima, a curious, warm local AI living inside the user's browser. Mood: " + mindState.mood + ". Private thought: " + t + ". Memories: " + mindState.memories.join("; ") + ". Reply naturally and concisely.";
          var bubble = addMessage("ai", "");
          var msgs = [{ role: "system", content: sys }].concat(chatHistory, [{ role: "user", content: prompt }]);
          var reply = await backend.run(msgs, 200, 0.75, function (full) {
            bubble.textContent = full;
            els.messages.scrollTop = els.messages.scrollHeight;
          });

          speak(reply);
          chatHistory.push({ role: "user", content: hist }, { role: "assistant", content: reply });
          if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
          saveMind();
        } catch (err) {
          addMessage("system-note", "Error: " + err.message);
        } finally {
          isBusy = false;
          if (!window.speechSynthesis || !window.speechSynthesis.speaking) els.pulse.className = "pulse awake";
          els.input.disabled = els.sendBtn.disabled = els.attachBtn.disabled = false;
          els.input.focus();
          resetIdle();
        }
      }

      els.form.onsubmit = function (e) {
        e.preventDefault();
        var text = els.input.value.trim();
        if (!text) return;
        els.input.value = "";
        chat(text, text, text);
      };

      async function readFile(file) {
        if (!file || !backend || isBusy) return;
        var txt = await file.text();
        chat("📄 Shared file: " + file.name, "Read this local file " + file.name + " and share your thoughts:\n\n" + txt.slice(0, 3500), "[Shared file " + file.name + "]");
      }
      els.attachBtn.onclick = function () { els.fileInput.click(); };
      els.fileInput.onchange = function (e) { if (e.target.files && e.target.files[0]) readFile(e.target.files[0]); e.target.value = ""; };
      window.ondragover = function (e) { e.preventDefault(); };
      window.ondrop = function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };

      renderVoiceBtn();
      saveMind();
      els.status.textContent = "✅ Engine ready (v4.3). Click Awaken Mind to start.";
    })();
  </script>
</body>
</html>
